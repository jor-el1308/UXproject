<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games CCA - Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .navbar {
            background-color: #2c3e50;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .Logo {
            height: 90px;
        }
        
        .NavMenu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .navItem {
            margin-left: 20px;
        }
        
        .navLink {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .navLink:hover {
            color: #3498db;
        }
        
        .NavSideBar {
            display: none;
            cursor: pointer;
        }
        
        .Bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px 0;
            background-color: white;
        }
        
        .signup-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .checkbox-group {
            margin-top: 20px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .checkbox-label input {
            width: auto;
            margin-right: 10px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        @media (max-width: 768px) {
            .NavMenu {
                display: none;
            }
            
            .NavSideBar {
                display: block;
            }
            
            .signup-container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../images/Vapor.png" class="Logo">
            <ul class="NavMenu">
                <li class="navItem">
                    <a href="CCA.html" class="navLink">Home</a>
                </li>
                <li class="navItem">
                    <a href="#" class="navLink">Next Week's Game</a>
                </li>
                <li class="navItem">
                    <a href="#" class="navLink">Next Week's Activities</a>
                </li>
                <li class="navItem">
                    <a href="#" class="navLink">Events</a>
                </li>
                <li class="navItem">
                    <a href="#" class="navLink">Signing Up</a>
                </li>
            </ul>
            <div class="NavSideBar">
                <span class="Bar"></span>
                <span class="Bar"></span>
                <span class="Bar"></span>
            </div>
        </nav>
    </header>

    <div class="signup-container">
        <h1>Join Board Games CCA</h1>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" required>
            </div>
            
            <div class="form-group">
                <label for="grade">Grade/Class</label>
                <input type="text" id="grade" name="grade" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="experience">Board Game Experience Level</label>
                <select id="experience" name="experience" required>
                    <option value="">Select your experience level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="interests">What types of board games interest you most?</label>
                <input type="text" id="interests" name="interests" placeholder="Strategy, Cooperative, Party Games, etc.">
            </div>
            
            <div class="checkbox-group">
                <p>Availability (Check all that apply):</p>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="monday"> Monday After School
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="wednesday"> Wednesday After School
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="friday"> Friday After School
                </label>
            </div>
            
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="agree" required> I agree to the club rules and code of conduct
                </label>
            </div>
            
            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Here you would typically send the form data to a server
            // For now, we'll just show an alert
            alert('Thank you for your application to Board Games CCA! We will contact you soon.');
            
            // Reset the form
            this.reset();
        });
        
        // Mobile menu toggle functionality
        const navSideBar = document.querySelector('.NavSideBar');
        const navMenu = document.querySelector('.NavMenu');
        
        if (navSideBar) {
            navSideBar.addEventListener('click', function() {
                navMenu.style.display = navMenu.style.display === 'flex' ? 'none' : 'flex';
            });
        }
    </script>
</body>
</html>

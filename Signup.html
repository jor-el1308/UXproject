<br>
    <div class="signup-container">
        <h1>Join Board Games CCA</h1>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" required>
            </div>
            
            <div class="form-group">
                <label for="grade">Grade/Class</label>
                <input type="text" id="grade" name="grade" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="experience">Board Game Experience Level</label>
                <select id="experience" name="experience" required>
                    <option value="">Select your experience level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="interests">What types of board games interest you most?</label>
                <input type="text" id="interests" name="interests" placeholder="Strategy, Cooperative, Party Games, etc.">
            </div>
            
            <div class="checkbox-group">
                <p>Availability (Check all that apply):</p>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="monday"> Monday After School
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="wednesday"> Wednesday After School
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="availability" value="friday"> Friday After School
                </label>
            </div>
            
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="agree" required> I agree to the club rules and code of conduct
                </label>
            </div>
            <a href="complete.html">
                <button type="submit" onclick="">Submit Application</button>
            </a>
        </form>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            alert('Thank you for your application to Board Games CCA! We will contact you soon.');
            window.location.href = 'complete.html';
            this.reset();
        });
    </script>
    <script src="Header.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games CCA - Vote for Next Week's Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .navbar {
            background-color: #2c3e50;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .Logo {
            height: 90px;
        }

        .NavMenu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navItem {
            margin-left: 20px;
        }

        .navLink {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }

        .navLink:hover {
            color: #3498db;
        }

        .NavSideBar {
            display: none;
            cursor: pointer;
        }

        .Bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px 0;
            background-color: white;
        }

        .vote-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .radio-label {
            display: block;
            margin-bottom: 12px;
            font-size: 16px;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        @media (max-width: 768px) {
            .NavMenu {
                display: none;
            }

            .NavSideBar {
                display: block;
            }

            .vote-container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../images/Vapor.png" class="Logo">
            <ul class="NavMenu">
                <li class="navItem"><a href="CCA.html" class="navLink">Home</a></li>
                <li class="navItem"><a href="next-week-game.html" class="navLink">Next Week's Game</a></li>
                <li class="navItem"><a href="#" class="navLink">Next Week's Activities</a></li>
                <li class="navItem"><a href="#" class="navLink">Events</a></li>
                <li class="navItem"><a href="signup.html" class="navLink">Signing Up</a></li>
                <li class="navItem"><a href="vote-game.html" class="navLink">Vote</a></li>
            </ul>
            <div class="NavSideBar">
                <span class="Bar"></span>
                <span class="Bar"></span>
                <span class="Bar"></span>
            </div>
        </nav>
    </header>

    <div class="vote-container">
        <h1>Vote for Next Week's Game</h1>

        <form id="voteForm">
            <div class="form-group">
                <label>Choose your favorite board game:</label>
                <label class="radio-label"><input type="radio" name="game" value="Catan" required> Catan</label>
                <label class="radio-label"><input type="radio" name="game" value="Dixit"> Dixit</label>
                <label class="radio-label"><input type="radio" name="game" value="Codenames"> Codenames</label>
                <label class="radio-label"><input type="radio" name="game" value="Ticket to Ride"> Ticket to Ride</label>
                <label class="radio-label"><input type="radio" name="game" value="Uno"> Uno</label>
                <label class="radio-label"><input type="radio" name="game" value="Other"> Other</label>
            </div>

            <div class="form-group">
                <label for="otherGame">If other, please specify:</label>
                <input type="text" id="otherGame" name="otherGame" placeholder="Enter your suggestion">
            </div>

            <button type="submit">Submit Vote</button>
        </form>
    </div>

    <script>
        document.getElementById('voteForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const selectedGame = document.querySelector('input[name="game"]:checked');
            const otherGame = document.getElementById('otherGame').value;

            const vote = selectedGame.value === "Other" && otherGame
                ? otherGame
                : selectedGame.value;

            alert(`Thank you for voting! Your choice: ${vote}`);
            this.reset();
        });

        // Mobile menu toggle
        const navSideBar = document.querySelector('.NavSideBar');
        const navMenu = document.querySelector('.NavMenu');

        if (navSideBar) {
            navSideBar.addEventListener('click', function () {
                navMenu.style.display = navMenu.style.display === 'flex' ? 'none' : 'flex';
            });
        }
    </script>
</body>
</html>

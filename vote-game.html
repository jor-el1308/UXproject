    <div class="signup-container">
        <h1>Vote for Next Week's Game</h1>

        <form id="voteForm">
            <div class="form-group">
                <label>Choose your favorite board game:</label>
                <label class="radio-label"><input type="radio" name="game" value="Catan" required> Catan</label>
                <label class="radio-label"><input type="radio" name="game" value="Dixit"> Dixit</label>
                <label class="radio-label"><input type="radio" name="game" value="Codenames"> Codenames</label>
                <label class="radio-label"><input type="radio" name="game" value="Ticket to Ride"> Ticket to Ride</label>
                <label class="radio-label"><input type="radio" name="game" value="Uno"> Uno</label>
                <label class="radio-label"><input type="radio" name="game" value="Other"> Other</label>
            </div>

            <div class="form-group">
                <label for="otherGame">If other, please specify:</label>
                <input type="text" id="otherGame" name="otherGame" placeholder="Enter your suggestion">
            </div>

            <button type="submit">Submit Vote</button>
        </form>
    </div>

    <script>
        document.getElementById('voteForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const selectedGame = document.querySelector('input[name="game"]:checked');
            const otherGame = document.getElementById('otherGame').value;

            const vote = selectedGame.value === "Other" && otherGame
                ? otherGame
                : selectedGame.value;

            alert(`Thank you for voting! Your choice: ${vote}`);
            this.reset();
        });
    </script>
    <script src="Header.js"></script>
